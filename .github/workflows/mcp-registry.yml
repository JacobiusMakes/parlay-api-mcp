name: MCP Registry

on:
  pull_request:
    paths:
      - 'server*.json'
      - 'registry/**'
      - 'pyproject.toml'
      - 'README.md'
      - 'scripts/*registry*.py'
      - '.github/workflows/mcp-registry.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install schema validator
        run: python3 -m pip install 'jsonschema==4.26.0'
      - name: Check registry serialization handling
        run: python3 -m unittest discover -s scripts -p 'test_registry.py'
      - name: Validate registry metadata for a pull request
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_registry.py --allow-unpublished-package
      - name: Validate registry metadata and published package
        if: github.event_name != 'pull_request'
        run: python3 scripts/check_registry.py

  publish:
    needs: validate
    if: >-
      github.repository == 'JacobiusMakes/parlay-api-mcp' &&
      (github.event_name == 'release' ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Install schema validator
        run: python3 -m pip install 'jsonschema==4.26.0'
      - name: Check whether publication is needed
        id: manifest
        run: python3 scripts/check_registry.py
      - name: Install verified publisher
        if: steps.manifest.outputs.needs_publish == 'true'
        run: |
          curl --fail --location --silent --show-error --max-time 60 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/mcp-publisher.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Publish with GitHub OIDC
        if: steps.manifest.outputs.needs_publish == 'true'
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish server.official.json
      - name: Verify live registry metadata
        run: python3 scripts/check_registry.py --published
