name: MCP container

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build stdio container
        run: docker build --tag parlayapi-mcp:check .
      - name: Verify non-root runtime
        run: test "$(docker image inspect --format '{{.Config.User}}' parlayapi-mcp:check)" = '10001:10001'
      - name: Install protocol test client
        run: python3 -m pip install 'mcp==2.1.1'
      - name: Discover tools with no network or credentials
        run: python3 scripts/check_container.py
      - name: Clean up test container and image
        if: always()
        run: |
          docker rm --force parlayapi-mcp-check 2>/dev/null || true
          docker image rm parlayapi-mcp:check 2>/dev/null || true
