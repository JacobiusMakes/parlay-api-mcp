name: Docker catalog checks

# Review and merge this workflow before explicitly running the hosted checks.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-catalog-check
  cancel-in-progress: false

jobs:
  catalog:
    if: github.repository == 'JacobiusMakes/parlay-api-mcp' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ""
      GH_TOKEN: ""
      PARLAYAPI_KEY: ""
      PARLAY_API_KEY: ""
    steps:
      - name: Check out the exact Docker catalog submission
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JacobiusMakes/mcp-registry
          ref: 7343e28955f091b5ecfcd32ce5eb3cf17c1f0e9f
          path: registry
          persist-credentials: false

      - name: Set up Go required by the pinned registry
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: registry/go.mod
          cache: false

      - name: Set up Node for upstream Prettier validation
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Check immutable input and metadata-only build path
        working-directory: registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7343e28955f091b5ecfcd32ce5eb3cf17c1f0e9f
          test -f servers/parlayapi/tools.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          tools = json.loads(Path('servers/parlayapi/tools.json').read_text())
          assert len(tools) == 22 and len({tool['name'] for tool in tools}) == 22
          assert 'commit: 29083331240dedf5c434f41bb634680fc9d03b6a' in Path('servers/parlayapi/server.yaml').read_text()
          print('Pinned catalog and source commit verified; tools.json supplies metadata without tool calls.')
          PY
          docker version
          docker buildx version
          npm install --no-save --package-lock=false --ignore-scripts prettier@3.9.6
          mkdir -p "$RUNNER_TEMP/docker-catalog-evidence"

      - name: Run official registry validation
        working-directory: registry
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          go run ./cmd/validate --name parlayapi 2>&1 | tee "$RUNNER_TEMP/docker-catalog-evidence/validate.log"

      - name: Run official image build with metadata discovery
        working-directory: registry
        shell: bash
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The pinned upstream command detects tools.json and reads metadata
          # from it. It does not start the server or call any account/API tool.
          go run ./cmd/build --tools parlayapi 2>&1 | tee "$RUNNER_TEMP/docker-catalog-evidence/build.log"
          docker image inspect mcp/parlayapi --format '{{json .Config.Labels}}' > "$RUNNER_TEMP/docker-catalog-evidence/image-labels.json"
          test "$(docker image inspect mcp/parlayapi --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = 29083331240dedf5c434f41bb634680fc9d03b6a

      - name: Run official catalog generation
        working-directory: registry
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          go run ./cmd/catalog parlayapi 2>&1 | tee "$RUNNER_TEMP/docker-catalog-evidence/catalog.log"
          test -s catalogs/parlayapi/catalog.yaml
          cp catalogs/parlayapi/catalog.yaml "$RUNNER_TEMP/docker-catalog-evidence/catalog.yaml"
          git diff --exit-code

      - name: Retain exact check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-catalog-parlayapi-7343e289
          path: ${{ runner.temp }}/docker-catalog-evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove this job's local build images
        if: always()
        shell: bash
        run: docker image rm -f mcp/parlayapi check || true
