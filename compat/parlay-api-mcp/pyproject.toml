[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "parlay-api-mcp"
version = "0.3.7"
description = "Compatibility install name for the official parlayapi-mcp package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob", email = "jacob@parlay-api.com" }]
requires-python = ">=3.10"
dependencies = ["parlayapi-mcp==0.3.7"]

[project.urls]
Homepage = "https://parlay-api.com"
Repository = "https://github.com/JacobiusMakes/parlay-api-mcp"
Issues = "https://github.com/JacobiusMakes/parlay-api-mcp/issues"

[project.scripts]
parlay-api-mcp = "parlayapi_mcp.server:main"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = ["/pyproject.toml", "/README.md", "/LICENSE"]
