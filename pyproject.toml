[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlay-api-mcp"
version = "0.1.0"
description = "MCP server for ParlayAPI: live sports odds, props, arbitrage, +EV, prediction markets for Claude/Cursor/Continue/Devin/Codex agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ParlayAPI", email = "support@parlay-api.com" }]
keywords = ["mcp", "sports", "odds", "betting", "arbitrage", "claude", "cursor", "agent", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://parlay-api.com"
Documentation = "https://parlay-api.com/docs"
Repository = "https://github.com/JacobiusMakes/parlay-api-mcp"
"Bug Tracker" = "https://github.com/JacobiusMakes/parlay-api-mcp/issues"

[project.scripts]
parlay-api-mcp = "parlay_api_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["parlay_api_mcp"]
