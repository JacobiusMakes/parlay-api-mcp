[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parlayapi-mcp"
version = "0.3.4"
description = "MCP server for ParlayAPI: sports odds, live previews, source-quality proof, and frictionless agent signup"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Jacob", email = "jacob@parlay-api.com" },
]
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10.0",
    "httpx>=0.27.0",
]
keywords = ["mcp", "claude", "sports", "odds", "betting", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://parlay-api.com"
Documentation = "https://parlay-api.com/docs"
Repository = "https://github.com/JacobiusMakes/parlay-api-mcp"
Issues = "https://github.com/JacobiusMakes/parlay-api-mcp/issues"

[project.scripts]
parlayapi-mcp = "parlayapi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["parlayapi_mcp"]
